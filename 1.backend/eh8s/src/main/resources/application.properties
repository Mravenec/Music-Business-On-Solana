spring.application.name=eh8s
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/eh8s
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
server.port=8080
# Slack / der-dirigent — secrets via env only (never commit real tokens).
# EH8S_SLACK_WEBHOOK_URL · EH8S_SLACK_BOT_TOKEN · EH8S_SLACK_CHANNEL_ID
eh8s.slack.webhook-url=${EH8S_SLACK_WEBHOOK_URL:}
eh8s.slack.bot-token=${EH8S_SLACK_BOT_TOKEN:}
eh8s.slack.channel-id=${EH8S_SLACK_CHANNEL_ID:}
eh8s.slack.channel-hint=${EH8S_SLACK_CHANNEL_HINT:#eh8s-owner}
# Slack Interactivity (Approve / Reject buttons): signing secret via env only. Blank = clicks refused (503).
eh8s.slack.signing-secret=${SLACK_SIGNING_SECRET:}
# JWT HS256 — override JWT_SECRET in env for anything other than local dev (32+ chars).
eh8s.jwt.secret=${JWT_SECRET:eh8s-dev-jwt-secret-change-me-32b}
eh8s.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
# Claude owner digest: ANTHROPIC_API_KEY via env only (never commit it). Blank = AI disabled (503).
eh8s.claude.api-key=${ANTHROPIC_API_KEY:}
eh8s.claude.model=${EH8S_CLAUDE_MODEL:claude-sonnet-4-5}
eh8s.claude.base-url=${EH8S_CLAUDE_BASE_URL:https://api.anthropic.com}
